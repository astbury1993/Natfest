name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: natfest-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: natfest-react

      - name: Build
        run: npm run build
        working-directory: natfest-react
        env:
          VITE_SANITY_PROJECT_ID: v3uvil06
          VITE_SANITY_DATASET: production
          VITE_CLOUDINARY_CLOUD_NAME: dyftspev
          VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Add CNAME for custom domain
        run: echo "www.natfest.co.uk" > natfest-react/dist/CNAME

      - name: Copy index.html as 404.html for SPA routing
        run: cp natfest-react/dist/index.html natfest-react/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: natfest-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
